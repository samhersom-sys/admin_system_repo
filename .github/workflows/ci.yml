name: CI

on:
  pull_request:
    branches:
      - development
      - uat
      - production
  push:
    branches:
      - development
      - uat
      - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Run frontend scan tests
        working-directory: frontend
        run: npm run test:scan

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  website:
    name: Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: policyforge
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: policyforge_cleaned
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policyforge -d policyforge_cleaned"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://policyforge:changeme@127.0.0.1:5432/policyforge_cleaned
      JWT_SECRET: ci-jwt-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/nest/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Nest backend dependencies
        working-directory: backend/nest
        run: npm ci

      - name: Sync database schema
        run: npm run db:sync

      - name: Seed ephemeral CI database
        env:
          NODE_ENV: development
        run: npm run db:seed

      - name: Run NestJS unit tests
        working-directory: backend/nest
        run: npm test

      - name: Build Nest backend
        run: npm run build:backend